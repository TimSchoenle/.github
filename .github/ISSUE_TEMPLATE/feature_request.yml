name: Feature request
description: Propose new behaviour or a change to existing behaviour.
title: "[Feature]: "
labels: ["enhancement"]
body:
  - type: checkboxes
    id: preflight
    attributes:
      label: Preflight
      options:
        - label: I searched open and closed issues and found no duplicate.
          required: true
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What you are trying to do and what prevents it today. Describe the problem, not the solution.
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed solution
      description: The behaviour or configuration you would expect.
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
      description: Workarounds you use now and other approaches you rejected, with the reason.
  - type: dropdown
    id: contribution
    attributes:
      label: Contribution
      options:
        - I would like to implement this myself
        - I can help test it
        - I cannot contribute to this
    validations:
      required: true
