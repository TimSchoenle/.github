name: Bug report
description: Something behaves differently from its documentation.
title: "[Bug]: "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Security vulnerabilities must not be reported here. Use private vulnerability reporting in the Security tab.
  - type: checkboxes
    id: preflight
    attributes:
      label: Preflight
      options:
        - label: I searched open and closed issues and found no duplicate.
          required: true
        - label: I reproduced this on the latest release or the default branch.
          required: true
  - type: input
    id: version
    attributes:
      label: Version
      description: Release tag, chart version, image tag or commit SHA.
      placeholder: v1.4.2
    validations:
      required: true
  - type: input
    id: component
    attributes:
      label: Affected component
      description: Crate, chart, action, service or module. Leave empty if the repository has only one.
  - type: textarea
    id: environment
    attributes:
      label: Environment
      description: Operating system, runtime and its version, Kubernetes and Helm versions, or browser, as applicable.
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Steps to reproduce
      description: The minimal sequence that triggers the bug, including configuration with secrets removed.
      placeholder: |
        1.
        2.
        3.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behaviour
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual behaviour
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Logs
      description: Relevant output, with secrets removed. Rendered as a code block.
      render: text
